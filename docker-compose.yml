# no version needed since 2020

services:
  jekyll:
    image: bretfisher/jekyll-serve
    volumes:
      - .:/site
    ports:
      - "4000:4000"
  crawler:
    # Fixed name so the deploy workflow's `docker build -t aixleuphanade-crawler` matches
    image: aixleuphanade-crawler
    build:
      context: .
      dockerfile: Dockerfile.crawler
      network: host
    volumes:
      - .:/site
    env_file:
      # Not tracked by git (holds SMTP_PASSWORD); without it the crawler runs but sends no email
      - path: .env
        required: false