---
layout: default
---
<article class="publication-page">
  <div class="publication-header" style="margin-bottom: 2rem; border-bottom: 2px solid var(--c-granit-20); padding-bottom: 1.5rem;">
    <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">{{ page.title }}</h1>
    <div class="publication-meta" style="font-size: 1.1rem; color: var(--text-secondary);">
      <p style="margin: 0.5rem 0;"><strong>Authors:</strong> {{ page.authors | join: ", " }}</p>
      <p style="margin: 0.5rem 0;"><strong>Year:</strong> {{ page.year }}</p>
    </div>
  </div>

  <div class="publication-content" style="font-size: 1.1rem; max-width: 800px; line-height: 1.8;">
    {{ content }}
  </div>

  <div class="back-link" style="margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--c-granit-20);">
    <a href="{{ '/publications/' | relative_url }}" class="btn btn-secondary">← Back to Publications</a>
  </div>
</article>
