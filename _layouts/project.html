---
layout: default
---
<article class="project-page">
  <div class="project-header" style="margin-bottom: 2rem; border-bottom: 2px solid var(--c-granit-20); padding-bottom: 1.5rem;">
    <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">{{ page.title }}</h1>
    <div class="project-meta" style="font-size: 1.1rem; color: var(--text-secondary);">
      {% if page.status %}
        <p style="margin: 0.5rem 0;"><strong>Status:</strong> <span style="background: var(--c-granit-20); padding: 0.2rem 0.6rem; border-radius: 4px;">{{ page.status }}</span></p>
      {% endif %}
      {% if page.team %}
        <p style="margin: 0.5rem 0;"><strong>Team:</strong> {{ page.team | join: ", " }}</p>
      {% endif %}
      {% if page.github_repo %}
        <p style="margin: 0.5rem 0;">
          <strong>GitHub:</strong> <a href="{{ page.github_repo }}" target="_blank" style="color: var(--c-blau);">{{ page.github_repo }}</a>
        </p>
      {% endif %}
    </div>
  </div>

  <div class="project-content" style="font-size: 1.1rem; max-width: 800px; line-height: 1.8;">
    {{ content }}
  </div>

  <div class="back-link" style="margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--c-granit-20);">
    <a href="{{ '/projects/' | relative_url }}" class="btn btn-secondary" style="display: inline-block; padding: 0.5rem 1rem; background: var(--c-granit-20); color: var(--text-primary); text-decoration: none; border-radius: 4px;">← Back to Projects</a>
  </div>
</article>
