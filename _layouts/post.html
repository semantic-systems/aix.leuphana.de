---
layout: default
---
<article class="post-page">
  <div class="post-header" style="margin-bottom: 3rem; border-bottom: 2px solid var(--c-granit-20); padding-bottom: 2rem;">
    <h1 style="font-size: 3rem; margin-bottom: 1rem; color: var(--c-jaspis); line-height: 1.2;">{{ page.title }}</h1>
    <div class="post-meta" style="font-size: 1.1rem; color: var(--text-secondary); display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem;">
      <time datetime="{{ page.date | date_to_xmlschema }}" style="font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">
        {{ page.date | date: "%B %-d, %Y" }}
      </time>
      {% if page.author %}
        <span>•</span>
        <span>By {{ page.author }}</span>
      {% endif %}
    </div>
    
    {% if page.image and page.image != "" %}
    <div class="post-featured-image" style="width: 100%; max-height: 400px; overflow: hidden; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
      <img src="{{ page.image | relative_url }}" alt="{{ page.title }}" style="width: 100%; height: auto; object-fit: cover;">
    </div>
    {% endif %}
  </div>

  <div class="post-content" style="font-size: 1.15rem; max-width: 800px; line-height: 1.8; color: var(--text-primary);">
    {{ content }}
  </div>

  <div class="back-link" style="margin-top: 4rem; padding-top: 2rem; border-top: 1px solid var(--c-granit-20);">
    <a href="{{ '/news/' | relative_url }}" class="btn btn-secondary">← Back to News</a>
  </div>
</article>
