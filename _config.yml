# Site settings (restart `jekyll serve` after changes)
title: AIX - Artificial Intelligence and Explainability | Leuphana University
email: aix@leuphana.de
author:
  name: AIX Research Group
  email: aix@leuphana.de
social:
  name: AIX Research Group
  links:
    - https://www.linkedin.com/school/aix-leuphana/
    - https://github.com/semantic-systems
description: >- # this means to ignore newlines until "baseurl:"
  AIX is a research group led by Prof. Dr. Ricardo Usbeck at Leuphana University that
  focuses on the topic of neuro-symbolic AI, where neural network-based machine learning
  is combined with symbolic AI, to arrive at explainable and responsible real-world solutions
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://aix.leuphana.de" # the base hostname & protocol for your site, e.g. http://example.com
#twitter_username: jekyllrb
github:  "https://github.com/semantic-systems"
linkedin: "https://www.linkedin.com/school/aix-leuphana/"
leuphana: "https://www.leuphana.de/en/institutes/iis/artificial-intelligence-and-explainability.html"

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate-v2
  - jekyll-sitemap

pagination:
  enabled: true
  per_page: 10
  title: ':title - Page :num'



# Collections
collections:
  team:
    output: true
    permalink: /team/:path/
  publications:
    output: true
    permalink: /publications/:path/
  projects:
    output: true
    permalink: /projects/:path/
  demos:
    output: true
    permalink: /demos/:path/

# Not built into the website
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - venv/
  - fetch_venv/
  - scripts/
  - fetch_team_members.py
  - README.md
  - link_cache.json
  - link_notification_state.json
  - Dockerfile.crawler
  - docker-compose.yml
  - requirements.txt
  - docs/
  - tests/
  - test/
  - _projects/list_of_projects.txt
  - "assets/Leuphana Styleguide Corporate Design.pdf"

# Internal tools: served as-is, kept out of the sitemap (see robots.txt as well)
defaults:
  - scope:
      path: "tools"
    values:
      sitemap: false
