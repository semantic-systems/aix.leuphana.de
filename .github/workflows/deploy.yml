name: Deploy to VPS
on:
  push:
    branches: [ main ]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        
      - name: Install Playwright browsers
        run: playwright install --with-deps
        
      - name: Run tests
        run: pytest

  build-jekyll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          
      - name: Build Jekyll site
        run: |
          bundle install
          bundle exec jekyll build

  deploy:
    needs: [test-python, build-jekyll]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Optional repository secret; when set, it is written to the server's .env
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 575
          envs: SMTP_PASSWORD
          script: |
            # Stop at the first failing command so a broken deploy fails this job
            set -eu
            cd /opt/jekyll/aix.leuphana.de
            # .env holds secrets and is not tracked by git: keep the server's copy across the reset
            if [ -f .env ]; then cp .env "$HOME/.aix-env.keep"; fi
            # Discard any local changes and force the server to match GitHub exactly
            git fetch origin
            git reset --hard origin/main
            if [ ! -f .env ] && [ -f "$HOME/.aix-env.keep" ]; then mv "$HOME/.aix-env.keep" .env; fi
            rm -f "$HOME/.aix-env.keep"
            # The SMTP_PASSWORD repository secret, when set, replaces that line in .env (other lines are kept)
            if [ -n "${SMTP_PASSWORD:-}" ]; then
              (umask 077; { grep -v '^SMTP_PASSWORD=' .env 2>/dev/null || true; printf 'SMTP_PASSWORD=%s\n' "$SMTP_PASSWORD"; } > .env.new)
              mv .env.new .env
            fi
            # Build the crawler image before stopping anything. Its build needs host
            # networking, which newer Docker Compose versions refuse to grant
            # ("pass --allow=network.host"), so it is built with plain docker build.
            docker build --network host -f Dockerfile.crawler -t aixleuphanade-crawler .
            # Restart the containers from the images that are now in place
            docker compose down
            docker compose up -d --no-build
            docker compose ps
            # Fail the job unless the site answers within 5 minutes (Jekyll rebuilds on start)
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null http://localhost:4000/; then echo "Site is up"; break; fi
              if [ "$i" -eq 30 ]; then echo "Site did not come up"; docker compose logs --tail 50 jekyll; exit 1; fi
              sleep 10
            done
            # Both services are long-running (the crawler loops daily), so fail the job if
            # any of them has already exited. Checked after the wait so startup crashes show up.
            expected=$(docker compose config --services | sort | tr '\n' ' ')
            running=$(docker compose ps --services --status running | sort | tr '\n' ' ')
            if [ "$running" != "$expected" ]; then
              echo "Not all services are running. Expected: $expected Running: $running"
              docker compose ps --all
              docker compose logs --tail 50
              exit 1
            fi
            echo "All services running: $running"
            # Clean up dangling images to prevent disk space exhaustion
            docker image prune -f
